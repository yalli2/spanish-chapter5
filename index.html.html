<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>English Grammar Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Noto+Sans+KR:wght@400;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky top bar with unit pills; single 980px column; home = hero + numbered steps + unit card grid; unit = header, Learn/Practice tabs, exercise cards */
:root{
  --paper:#F5F7FB; --surface:#FFFFFF; --ink:#151C2C; --muted:#586379; --line:#DDE2EC;
  --accent:#2747C9; --accent-ink:#FFFFFF; --hl:#FFE14D; --soft:#EBF0FC;
  --ok:#17804A; --ok-bg:#E3F5EA; --bad:#C2352B; --bad-bg:#FCE9E7;
  --u1:#2747C9; --u2:#0B8273; --u3:#C9561F; --u4:#A8306F; --u5:#4F8417;
  --f-display:"Bricolage Grotesque", "Noto Sans KR", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1320; --surface:#171D2D; --ink:#E9EDF6; --muted:#9AA5BC; --line:#2A3247;
    --accent:#8AA2FF; --accent-ink:#0F1320; --hl:rgba(255,215,40,.38); --soft:#1D2540;
    --ok:#5FD08F; --ok-bg:#15301F; --bad:#FF8A7E; --bad-bg:#3A1C1A;
    --u1:#8AA2FF; --u2:#4FD1BD; --u3:#FF9E6B; --u4:#F07FB8; --u5:#A6D86A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1320; --surface:#171D2D; --ink:#E9EDF6; --muted:#9AA5BC; --line:#2A3247;
  --accent:#8AA2FF; --accent-ink:#0F1320; --hl:rgba(255,215,40,.38); --soft:#1D2540;
  --ok:#5FD08F; --ok-bg:#15301F; --bad:#FF8A7E; --bad-bg:#3A1C1A;
  --u1:#8AA2FF; --u2:#4FD1BD; --u3:#FF9E6B; --u4:#F07FB8; --u5:#A6D86A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
mark{background:linear-gradient(transparent 52%,var(--hl) 52%);color:inherit;padding:0 .08em}
.wrap{max-width:980px;margin:0 auto;padding-inline:20px}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.15rem;text-decoration:none;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:12px;height:22px;background:var(--hl);border-radius:3px;transform:skew(-12deg)}
.pills{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:1;justify-content:flex-end;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem;padding:6px 12px;border-radius:999px;border:1px solid transparent}
.pill:hover{color:var(--ink);border-color:var(--line)}
.pill[aria-current="page"]{background:var(--ink);color:var(--paper)}

main{padding-block:32px 72px}

/* home */
.hero{display:grid;gap:14px;padding-block:12px 28px}
.hero .mono{color:var(--accent)}
.hero h1{font-size:clamp(2.1rem,5.4vw,3.6rem);font-weight:800;letter-spacing:-.02em;max-width:16ch}
.hero p{color:var(--muted);max-width:60ch;margin:0;font-size:1.08rem}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:40px}
.step{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-top:3px solid var(--ink)}
.step b{font-family:var(--f-display);font-size:1.6rem;line-height:1}
.step strong{display:block}
.step span{color:var(--muted);font-size:.93rem}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-title h2{font-size:1.5rem}
.sec-title span{color:var(--muted);font-size:.92rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ucard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ucard .top{display:flex;align-items:center;gap:14px}
.unum{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;color:var(--uc);min-width:1.4ch}
.ucard h3{font-size:1.3rem}
.ucard .focus{color:var(--muted);font-size:.9rem}
.sample{font-size:1.02rem;padding:10px 12px;background:var(--soft);border-radius:10px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--uc);border-radius:99px}
.actions{display:flex;gap:8px;margin-top:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.actions .btn{flex:1}
.foot{margin-top:40px;color:var(--muted);font-size:.88rem}

/* unit header + tabs */
.crumb{color:var(--muted);font-size:.92rem;text-decoration:none}
.crumb:hover{color:var(--ink)}
.uhead{display:flex;gap:20px;align-items:flex-end;padding-block:14px 22px;flex-wrap:wrap}
.uhead .unum{font-size:clamp(4rem,10vw,6.5rem);letter-spacing:-.04em}
.uhead div{min-width:0;flex:1}
.uhead h1{font-size:clamp(1.9rem,4.6vw,2.9rem);font-weight:800;letter-spacing:-.015em}
.uhead p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:28px}
.tab{background:none;border:0;padding:10px 18px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;text-decoration:none}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--uc)}
.tab small{font-weight:400;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}

/* learn */
.lsec{display:grid;grid-template-columns:44px minmax(0,1fr);gap:16px;padding-block:22px;border-top:1px solid var(--line)}
.lsec:first-child{border-top:0;padding-top:0}
.letter{width:40px;height:40px;border-radius:10px;background:var(--uc);color:var(--paper);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.lsec h2{font-size:1.35rem;margin-bottom:10px}
.lsec p{margin:0 0 12px;max-width:65ch}
.ex{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.ex li{padding-left:20px;position:relative}
.ex li::before{content:"";position:absolute;left:4px;top:.65em;width:7px;height:7px;border-radius:50%;background:var(--uc)}
.tbl{overflow-x:auto;margin:4px 0 14px}
table.gt{border-collapse:collapse;min-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:.98rem}
.gt th,.gt td{padding:9px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.gt th{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
.gt tr:last-child td{border-bottom:0}
.gt td.sf{color:var(--muted)}
.note{background:var(--soft);border-left:4px solid var(--uc);padding:12px 16px;border-radius:0 10px 10px 0;margin:4px 0 12px;max-width:68ch}
.note b{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;display:block;color:var(--uc);margin-bottom:2px}
.profile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;max-width:560px;margin-bottom:12px}
.profile .who{font-family:var(--f-display);font-weight:800;font-size:1.1rem;margin-bottom:6px}
.wrong{text-decoration:line-through;color:var(--bad)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-width:560px;margin:4px 0 12px}
.scale div{text-align:center;font-size:.88rem;padding:8px 4px;border-radius:8px;background:var(--soft);font-weight:700}
.scale small{display:block;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.gonext{margin-top:20px;display:flex;justify-content:flex-end}

/* practice */
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:20px}
.set-h{display:flex;gap:12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap;margin-bottom:4px}
.set-h h2{font-size:1.2rem}
.set-h .sid{font-family:var(--f-mono);font-size:.8rem;color:var(--uc);margin-right:8px}
.instr{color:var(--muted);margin:0 0 14px}
.badge{font-family:var(--f-mono);font-size:.82rem;padding:4px 10px;border-radius:99px;background:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge.good{background:var(--ok-bg);color:var(--ok)}
.badge.low{background:var(--bad-bg);color:var(--bad)}
.items{list-style:none;margin:0;padding:0;display:grid;gap:4px;counter-reset:q}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) 26px;gap:10px;align-items:start;padding:10px 8px;border-radius:10px;counter-increment:q}
.item::before{content:counter(q);font-family:var(--f-mono);font-size:.85rem;color:var(--muted);padding-top:.35em;text-align:right}
.item.ok{background:var(--ok-bg)}
.item.bad{background:var(--bad-bg)}
.mark{font-weight:800;padding-top:.3em;text-align:center}
.item.ok .mark{color:var(--ok)}
.item.bad .mark{color:var(--bad)}
.q{min-width:0}
.q .hint{color:var(--muted);font-size:.92rem}
.fix{display:block;margin-top:4px;font-size:.93rem;color:var(--bad)}
.fix b{color:var(--ink)}
input.ans{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-bottom:2px solid var(--muted);border-radius:6px;padding:3px 8px;width:9em;max-width:100%;margin:0 3px}
input.ans.wide{width:min(100%,24em);display:block;margin:6px 0 0}
input.ans:focus{border-color:var(--accent);outline:none}
.arrow{color:var(--muted);margin:0 4px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opts.inline{display:inline-flex;margin:0 4px;vertical-align:middle}
.opt{padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-weight:700;font-size:.96rem;text-align:left}
.opt:hover{border-color:var(--muted)}
.opt[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opts.stack{flex-direction:column;align-items:flex-start}
.opts.stack .opt{font-weight:400}
select.ans{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;margin-top:6px;max-width:100%}
.line{min-height:44px;border:1.5px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;background:var(--paper)}
.line:empty::before{content:"아래 단어를 순서대로 눌러 보세요";color:var(--muted);font-size:.9rem;padding-left:6px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tile{padding:5px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.line .tile{background:var(--soft);border-color:var(--uc)}
.tile:hover{border-color:var(--ink)}
.set-f{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.example{font-size:.95rem;color:var(--muted);margin:-6px 0 12px}
.example i{font-style:normal;color:var(--ink);font-weight:700}

.result{border:2px solid var(--ink);border-radius:var(--r);padding:24px;display:grid;gap:14px;background:var(--surface);margin-top:8px}
.result .big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,8vw,4rem);line-height:1;font-variant-numeric:tabular-nums}
.result .big small{font-size:.4em;color:var(--muted);font-weight:600;margin-left:8px}
.result h2{font-size:1.4rem}
.breakdown{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.breakdown div{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:8px;background:var(--soft);font-size:.92rem;font-variant-numeric:tabular-nums}
.finish{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:20px 0}
.finish p{margin:0;color:var(--muted);flex:1;min-width:200px}
.unav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.unav a{text-decoration:none;color:var(--ink);font-weight:700}
.unav a span{display:block;font-weight:400;color:var(--muted);font-size:.85rem}

@media (max-width:640px){
  body{font-size:16px}
  .wrap{padding-inline:16px}
  .steps{grid-template-columns:1fr}
  .lsec{grid-template-columns:1fr;gap:10px}
  .set{padding:16px}
  .item{grid-template-columns:22px minmax(0,1fr) 20px;gap:8px;padding:10px 4px}
  .topbar .wrap{flex-wrap:wrap;gap:8px}
  .pills{justify-content:flex-start;flex-basis:100%}
}
@media (prefers-reduced-motion:no-preference){
  .bar i{transition:width .5s ease}
  .item{transition:background-color .25s}
}
</style>

<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#home"><i></i>Grammar Lab</a>
    <nav class="pills" id="pills" aria-label="Units"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<script>
const UNITS = [
{
  id:1, title:"am / is / are", focus:"be동사의 긍정문과 부정문",
  sample:"I<mark>'m</mark> from Brazil. My sisters <mark>aren't</mark> here.",
  intro:"am, is, are는 사람이 누구인지, 어디 출신인지, 기분이 어떤지, 사물이 어떤지 말할 때 써요.",
  learn:[
    {k:"A", t:"I am, he is, they are (주어에 맞는 be동사)", body:`
      <p>Leo의 자기소개를 읽어 보세요. 모든 문장에 <b>be동사</b>가 들어 있어요.</p>
      <div class="profile"><div class="who">Leo, Grade 7</div>
      Hi! My name <mark>is</mark> Leo. I<mark>'m</mark> 12 years old and I<mark>'m</mark> from Brazil.
      My favourite subject <mark>is</mark> science. My sisters <mark>are</mark> 9 and 15.
      I<mark>'m</mark> interested in robots. I<mark>'m not</mark> interested in fashion.</div>
      <div class="note"><b>규칙</b>I → <mark>am</mark> &nbsp;·&nbsp; he / she / it → <mark>is</mark> &nbsp;·&nbsp; we / you / they → <mark>are</mark></div>`},
    {k:"B", t:"긍정문과 부정문", body:`
      <div class="tbl"><table class="gt">
        <tr><th>긍정</th><th>줄임말</th><th>부정</th><th>줄임말</th></tr>
        <tr><td>I am</td><td class="sf">I'm</td><td>I am not</td><td class="sf">I'm not</td></tr>
        <tr><td>he / she / it is</td><td class="sf">he's / she's / it's</td><td>he / she / it is not</td><td class="sf">isn't &nbsp;or&nbsp; he's not</td></tr>
        <tr><td>we / you / they are</td><td class="sf">we're / you're / they're</td><td>we / you / they are not</td><td class="sf">aren't &nbsp;or&nbsp; we're not</td></tr>
      </table></div>
      <ul class="ex">
        <li>The library <mark>is</mark> very quiet today.</li>
        <li>My shoes <mark>are</mark> wet. It<mark>'s</mark> raining outside.</li>
        <li>Mr Park <mark>isn't</mark> here. He<mark>'s</mark> in a meeting.</li>
        <li>We <mark>aren't</mark> late. Class starts at nine.</li>
        <li>I<mark>'m not</mark> hungry, but I<mark>'m</mark> thirsty.</li>
      </ul>
      <div class="note"><b>기억하기</b>날씨, 시간, 기온을 말할 때는 주어로 <mark>it</mark>을 써요: It's sunny. It's ten o'clock. It's 30 degrees.</div>
      <div class="note"><b>부정문 만들기</b>be동사 뒤에 <mark>not</mark>을 붙여요. is not → isn't, are not → aren't. 단, am not은 줄이지 않고 <mark>I'm not</mark>으로 써요.</div>`},
    {k:"C", t:"that's, there's, here's (자주 쓰는 줄임말)", body:`
      <p>말할 때 아주 자주 쓰는 줄임말이에요.</p>
      <div class="tbl"><table class="gt">
        <tr><th>원래 형태</th><th>줄임말</th><th>예문</th></tr>
        <tr><td>that is</td><td class="sf">that's</td><td>Thank you. <mark>That's</mark> very kind.</td></tr>
        <tr><td>there is</td><td class="sf">there's</td><td>Look! <mark>There's</mark> a rainbow.</td></tr>
        <tr><td>here is</td><td class="sf">here's</td><td><mark>Here's</mark> your pencil.</td></tr>
      </table></div>`}
  ],
  sets:[
    {id:"1.1", title:"Short forms", instr:"줄임말로 써 보세요.", type:"type", strict:true,
     example:["she is","she's"],
     items:[
      {q:"they are", a:["they're"]},
      {q:"it is not", a:["it isn't","it's not"]},
      {q:"I am", a:["I'm"]},
      {q:"we are not", a:["we aren't","we're not"]},
      {q:"he is not", a:["he isn't","he's not"]},
      {q:"you are", a:["you're"]},
      {q:"that is", a:["that's"]},
      {q:"I am not", a:["I'm not"]}
    ]},
    {id:"1.2", title:"am, is or are?", instr:"알맞은 단어를 고르세요.", type:"mc", fixed:true,
     items:[
      {q:"My best friend ___ really funny.", o:["am","is","are"], a:"is"},
      {q:"The windows ___ open.", o:["am","is","are"], a:"are"},
      {q:"I ___ in the school band.", o:["am","is","are"], a:"am"},
      {q:"English ___ my favourite subject.", o:["am","is","are"], a:"is"},
      {q:"Sam and I ___ in the same class.", o:["am","is","are"], a:"are"},
      {q:"This sandwich ___ delicious.", o:["am","is","are"], a:"is"},
      {q:"Your books ___ on my desk.", o:["am","is","are"], a:"are"},
      {q:"I ___ very tired today.", o:["am","is","are"], a:"am"}
    ]},
    {id:"1.3", title:"Positive or negative?", instr:"문장 전체를 읽고 긍정인지 부정인지 고르세요.", type:"mc", fixed:true,
     items:[
      {q:"It's 30 degrees today. It ___ cold.", o:["is","isn't"], a:"isn't"},
      {q:"Bananas ___ blue. They're yellow.", o:["are","aren't"], a:"aren't"},
      {q:"I'm in Grade 8. I ___ in Grade 5.", o:["'m","'m not"], a:"'m not"},
      {q:"Seoul ___ in Korea.", o:["is","isn't"], a:"is"},
      {q:"The test ___ easy. Everyone got 100%.", o:["is","isn't"], a:"is"},
      {q:"Penguins ___ birds.", o:["are","aren't"], a:"are"}
    ]},
    {id:"1.4", title:"Make it negative", instr:"부정문으로 바꿔 쓰세요. 줄임말과 원래 형태 모두 정답이에요.", type:"type", wide:true,

{
  id:2, title:"am / is / are questions", focus:"be동사 의문문과 짧은 대답",
  sample:"<mark>Are</mark> you ready? Yes, I <mark>am</mark>.",
  intro:"be동사 의문문은 am, is, are를 주어 앞으로 보내서 만들어요. 대답은 짧게 Yes/No로 해요.",
  learn:[
    {k:"A", t:"어순 바꾸기", body:`
      <p>의문문에서는 <b>be동사</b>가 문장 맨 앞으로 와요. 문장 끝에는 물음표(?)를 붙여요.</p>
      <div class="tbl"><table class="gt">
        <tr><th>평서문</th><th>의문문</th></tr>
        <tr><td>You <mark>are</mark> ready.</td><td><mark>Are</mark> you ready?</td></tr>
        <tr><td>Your sister <mark>is</mark> at school.</td><td><mark>Is</mark> your sister at school?</td></tr>
        <tr><td>I <mark>am</mark> late.</td><td><mark>Am</mark> I late?</td></tr>
      </table></div>
      <div class="note"><b>형태</b><mark>am</mark> I? &nbsp;·&nbsp; <mark>is</mark> he / she / it? &nbsp;·&nbsp; <mark>are</mark> we / you / they?</div>`},
    {k:"B", t:"의문사로 시작하는 질문", body:`
      <p>의문사를 맨 앞에 쓰고, 그 뒤에 be동사와 주어를 써요. what(무엇), where(어디), who(누구), how(어떻게), why(왜), how old(몇 살), how much(얼마).</p>
      <ul class="ex">
        <li><mark>Where's</mark> the music room? &nbsp;(where's = where is)</li>
        <li><mark>What colour is</mark> your bag?</li>
        <li><mark>How old are</mark> your brothers?</li>
        <li><mark>How much are</mark> these pens?</li>
        <li><mark>Who's</mark> your teacher this year?</li>
        <li><mark>Why are</mark> you sad?</li>
      </ul>
      <div class="note"><b>줄임말</b>what's · where's · who's · how's = what is · where is · who is · how is</div>`},
    {k:"C", t:"짧은 대답", body:`
      <div class="tbl"><table class="gt">
        <tr><th>질문</th><th>Yes</th><th>No</th></tr>
        <tr><td>Are you hungry?</td><td>Yes, I <mark>am</mark>.</td><td>No, I<mark>'m not</mark>.</td></tr>
        <tr><td>Is he / she / it ...?</td><td>Yes, he <mark>is</mark>.</td><td>No, he <mark>isn't</mark>. &nbsp;/&nbsp; No, he's not.</td></tr>
        <tr><td>Are they ...?</td><td>Yes, they <mark>are</mark>.</td><td>No, they <mark>aren't</mark>. &nbsp;/&nbsp; No, they're not.</td></tr>
      </table></div>
      <div class="note"><b>주의</b>Yes로 대답할 때는 줄임말을 쓰지 않아요: Yes, she is. &nbsp;<span class="wrong">Yes, she's.</span></div>`}
  ],
  sets:[
    {id:"2.1", title:"Build the question", instr:"단어를 올바른 순서로 눌러 문장을 완성하세요. 다시 누르면 빠져요.", type:"order",
     items:[
      {w:["ready","you","are"], a:["Are you ready?"]},
      {w:["is","where","bathroom","the"], a:["Where is the bathroom?"]},
      {w:["your","what","is","name"], a:["What is your name?"]},
      {w:["old","sister","how","your","is"], a:["How old is your sister?"]},
      {w:["your","are","parents","at","home"], a:["Are your parents at home?"]},
      {w:["these","how","shoes","are","much"], a:["How much are these shoes?"]},
      {w:["late","why","you","are"], a:["Why are you late?"]}

    {id:"2.2", title:"Short answers", instr:"알맞은 짧은 대답을 고르세요.", type:"mc", stack:true,
     items:[
      {q:"Are you a student? <span class='hint'>(yes)</span>", o:["Yes, I am.","Yes, I'm.","Yes, I is."], a:"Yes, I am."},
      {q:"Is it raining? <span class='hint'>(no)</span>", o:["No, it isn't.","No, it not.","No, isn't it."], a:"No, it isn't."},
      {q:"Are they your friends? <span class='hint'>(yes)</span>", o:["Yes, they are.","Yes, they're.","Yes, are they."], a:"Yes, they are."},
      {q:"Is Ms Kim your teacher? <span class='hint'>(no)</span>", o:["No, she isn't.","No, he isn't.","No, she not."], a:"No, she isn't."},
      {q:"Am I late? <span class='hint'>(no)</span>", o:["No, you aren't.","No, I'm not.","No, you isn't."], a:"No, you aren't."},
      {q:"Is your house big? <span class='hint'>(yes)</span>", o:["Yes, it is.","Yes, it's.","Yes, is it."], a:"Yes, it is."}
    ]},
    {id:"2.3", title:"Match the answers", instr:"각 질문에 가장 알맞은 대답을 고르세요.", type:"select",
     options:["In my locker.","Three.","Black and white.","My cousin, Ana.","It's my birthday!","Fine, thanks."],
     items:[

      {q:"Why are you so happy?", a:"It's my birthday!"},
      {q:"How are you?", a:"Fine, thanks."}
    ]},
    {id:"2.4", title:"Complete the question", instr:"대답을 읽고 빈칸에 들어갈 말을 쓰세요.", type:"type",
     example:["___ your favourite sport? Basketball.","What's"],
     items:[
      {q:"___ the scissors? <span class='hint'>In the drawer.</span>", a:["Where are"]},
      {q:"___ your best friend? <span class='hint'>Jun.</span>", a:["Who's"]},
      {q:"___ you today? <span class='hint'>Very well, thank you.</span>", a:["How are"]},
      {q:"___ is this T-shirt? <span class='hint'>$15.</span>", a:["How much"]},
      {q:"___ your brother? <span class='hint'>He's 16.</span>", a:["How old is"]},

  ]
},
{
  id:3, title:"I am doing", focus:"현재진행형: 지금 일어나고 있는 일",
  sample:"Shh! The baby <mark>is sleeping</mark>.",
  intro:"am/is/are + 동사-ing로 지금 일어나고 있는 일을 말해요. (~하고 있다)",
  learn:[
    {k:"A", t:"am / is / are + 동사-ing", body:`
      <p>오전 10시, 204호 교실이에요. 지금 이 순간 일어나고 있는 일을 보세요.</p>
      <div class="profile">Ms Lee <mark>is writing</mark> on the board. Jae <mark>is reading</mark> his notes.
      Two students <mark>are working</mark> together. The fan <mark>is making</mark> a funny noise.
      Nobody <mark>is sleeping</mark>!</div>
      <div class="tbl"><table class="gt">
        <tr><th>주어</th><th>be동사</th><th>동사 + ing</th></tr>
        <tr><td>I</td><td>am (not)</td><td rowspan="3">working · eating · playing ...</td></tr>
        <tr><td>he / she / it</td><td>is (not)</td></tr>
        <tr><td>we / you / they</td><td>are (not)</td></tr>
      </table></div>
      <div class="note"><b>참고</b>꼭 지금 이 순간이 아니어도, 요즘 진행 중인 일에도 써요: I<mark>'m reading</mark> a great book this week.</div>`},
    {k:"B", t:"-ing 붙이는 방법", body:`
      <div class="tbl"><table class="gt">
        <tr><th>규칙</th><th>예시</th></tr>
        <tr><td>대부분의 동사: <b>-ing</b>만 붙여요</td><td>read → reading · play → playing · study → studying</td></tr>
        <tr><td><b>-e</b>로 끝나면: e를 빼고 -ing</td><td>make → making · write → writing · come → coming</td></tr>
        <tr><td>짧은 동사가 [모음 1개 + 자음 1개]로 끝나면: 마지막 자음을 한 번 더 쓰고 -ing</td><td>run → running · swim → swimming · sit → sitting · stop → stopping</td></tr>
        <tr><td><b>-ie</b>로 끝나면: ie를 y로 바꾸고 -ing</td><td>lie → lying · die → dying</td></tr>
      </table></div>`},
    {k:"C", t:"부정문", body:`
      <p>be동사 뒤에 <b>not</b>을 넣어요: am not / isn't / aren't + 동사-ing</p>
      <ul class="ex">
        <li>I<mark>'m not watching</mark> TV. I'm doing my homework.</li>
        <li>She <mark>isn't listening</mark> to the teacher.</li>
        <li>They <mark>aren't playing</mark> outside. It's too hot.</li>
      </ul>`}
  ],
  sets:[
    {id:"3.1", title:"Spell the -ing form", instr:"각 동사의 -ing 형태를 쓰세요. 철자에 주의하세요.", type:"type", strict:true,
     example:["read","reading"],
     items:[
      {q:"make", a:["making"]},{q:"swim", a:["swimming"]},{q:"play", a:["playing"]},
      {q:"write", a:["writing"]},{q:"sit", a:["sitting"]},{q:"study", a:["studying"]},
      {q:"lie", a:["lying"]},{q:"stop", a:["stopping"]},{q:"dance", a:["dancing"]},{q:"run", a:["running"]}
    ]},
    {id:"3.2", title:"What's happening now?", instr:"am / is / are + 동사-ing로 빈칸을 채우세요.", type:"type",
     example:["Look! It ___ (snow).","is snowing"],
     items:[
      {q:"Shh! The baby ___ <span class='hint'>(sleep)</span>.", a:["is sleeping"]},
      {q:"I ___ <span class='hint'>(wear)</span> my new shoes today.", a:["am wearing"]},
      {q:"Where are the kids? They ___ <span class='hint'>(play)</span> outside.", a:["are playing"]},
      {q:"We ___ <span class='hint'>(have)</span> lunch right now.", a:["are having"]},
      {q:"Mr Cho ___ <span class='hint'>(talk)</span> on the phone.", a:["is talking"]},
      {q:"Hurry up! Everybody ___ <span class='hint'>(wait)</span> for you.", a:["is waiting"]}
    ]},
    {id:"3.3", title:"Negative sentences", instr:"부정형(am not / isn't / aren't + -ing)으로 빈칸을 채우세요.", type:"type",
     items:[
      {q:"I ___ <span class='hint'>(not / watch)</span> TV. I'm doing homework.", a:["am not watching"]},
      {q:"She ___ <span class='hint'>(not / listen)</span> to me.", a:["isn't listening"]},
      {q:"They ___ <span class='hint'>(not / play)</span> football now. It's raining.", a:["aren't playing"]},
      {q:"You ___ <span class='hint'>(not / use)</span> your phone, so can I borrow it?", a:["aren't using"]},
      {q:"It ___ <span class='hint'>(not / rain)</span> now. Let's go out.", a:["isn't raining"]}
    ]},
    {id:"3.4", title:"Find the correct sentence", instr:"올바른 문장은 하나뿐이에요. 골라 보세요.", type:"mc", stack:true,
     items:[
      {q:"", o:["She is reading a book.","She reading a book.","She is read a book."], a:"She is reading a book."},
      {q:"", o:["They're swimming in the pool.","They're swiming in the pool.","They swimming in the pool."], a:"They're swimming in the pool."},
      {q:"", o:["I'm not working today.","I not working today.","I'm no working today."], a:"I'm not working today."},
      {q:"", o:["The bus is coming.","The bus is comeing.","The bus coming."], a:"The bus is coming."},
      {q:"", o:["We are sitting on the floor.","We are siting on the floor.","We sitting on the floor."], a:"We are sitting on the floor."}
    ]}
  ]
},

{
  id:5, title:"I do / work / like", focus:"현재시제: 습관과 사실",
  sample:"My sister <mark>plays</mark> the violin.",
  intro:"현재시제는 습관, 일상, 항상 사실인 것을 말할 때 써요. 주어가 he, she, it이면 동사에 -s를 붙여요.",
  learn:[
    {k:"A", t:"I work, she works (3인칭 단수 -s)", body:`
      <div class="tbl"><table class="gt">
        <tr><th>I / we / you / they</th><th>he / she / it</th></tr>
        <tr><td>I <mark>live</mark> in Busan.</td><td>She <mark>lives</mark> in Busan.</td></tr>
        <tr><td>We <mark>eat</mark> lunch at 12:30.</td><td>My brother <mark>eats</mark> lunch at 12:30.</td></tr>
        <tr><td>They <mark>like</mark> music.</td><td>The museum <mark>opens</mark> at 9 o'clock.</td></tr>
      </table></div>
      <div class="note"><b>규칙</b>주어가 he / she / it (3인칭 단수)이면 → 동사 + <mark>s</mark></div>`},
    {k:"B", t:"he / she / it일 때 철자", body:`
      <div class="tbl"><table class="gt">
        <tr><th>규칙</th><th>예시</th></tr>
        <tr><td>대부분의 동사: <b>-s</b>를 붙여요</td><td>read → reads · play → plays · work → works</td></tr>
        <tr><td>-s, -sh, -ch, -x, -o로 끝나면: <b>-es</b></td><td>watch → watches · wash → washes · fix → fixes · go → goes · do → does</td></tr>
        <tr><td>[자음 + y]로 끝나면: y를 i로 바꾸고 <b>-es</b></td><td>study → studies · fly → flies &nbsp;(단, [모음 + y]는 그냥 -s: play → plays)</td></tr>
        <tr><td>불규칙</td><td>have → <mark>has</mark></td></tr>
      </table></div>`},
    {k:"C", t:"언제 쓸까요?", body:`

    {k:"D", t:"빈도부사: always, usually, often, sometimes, never", body:`

      {q:"The sun ___ in the east.", o:["rise","rises"], a:"rises"},
      {q:"Bees ___ honey.", o:["make","makes"], a:"make"},
      {q:"Water ___ at 100°C.", o:["boil","boils"], a:"boils"},
      {q:"Elephants ___ grass and leaves.", o:["eat","eats"], a:"eat"},
      {q:"A week ___ seven days.", o:["have","has"], a:"has"},
      {q:"Light ___ faster than sound.", o:["travel","travels"], a:"travels"}
    ]},
    {id:"5.4", title:"always, often, never", instr:"올바른 문장은 하나뿐이에요. 골라 보세요.", type:"mc", stack:true,
     items:[
      {q:"", o:["I always walk to school.","I walk always to school.","Always I walk to school always."], a:"I always walk to school."},
      {q:"", o:["Tom never eats breakfast.","Tom eats never breakfast.","Tom never eat breakfast."], a:"Tom never eats breakfast."},
      {q:"", o:["We usually play outside.","We play usually outside.","We usually plays outside."], a:"We usually play outside."},
      {q:"", o:["She often reads at night.","She often read at night.","She often reading at night."], a:"She often reads at night."},
      {q:"", o:["They sometimes watch films.","They sometimes watches films.","They watch sometimes films."], a:"They sometimes watch films."}
    ]}
  ]
}
];

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = s => String(s).replace(/<[^>]+>/g,"");
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function norm(s, expand){
  s = String(s).toLowerCase().replace(/[‘’`´]/g,"'").replace(/[.?!,;:]/g," ").replace(/\s+/g," ").trim();
  if(expand){
    s = s.replace(/n't\b/g," not").replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'s\b/g," is").replace(/\s+/g," ").trim();
  }
  return s;
}
const total = u => u.sets.reduce((n,s)=>n+s.items.length,0);
let best = {};
try { best = JSON.parse(localStorage.getItem("glab-best")||"{}") || {}; } catch(e){ best = {}; }
function saveBest(id, pct){
  if(best[id]==null || pct>best[id]){ best[id]=pct; try{ localStorage.setItem("glab-best", JSON.stringify(best)); }catch(e){} }
}

/* ---------- router ---------- */
function route(){
  const h = (location.hash||"#home").slice(1);
  const m = h.match(/^unit([1-5])(?:-(practice))?$/);
  renderPills(m ? +m[1] : 0);
  if(m) renderUnit(+m[1], m[2] ? "practice" : "learn");
  else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);

function renderPills(active){
  $("#pills").innerHTML = `<a class="pill" href="#home" ${active===0?'aria-current="page"':""}>Home</a>` +
    UNITS.map(u=>`<a class="pill" href="#unit${u.id}" ${active===u.id?'aria-current="page"':""}>Unit ${u.id}</a>`).join("");
}

/* ---------- home ---------- */
function renderHome(){
  document.title = "English Grammar Lab";
  const done = UNITS.filter(u=>best[u.id]!=null).length;
  app.innerHTML = `
  <section class="hero">
    <span class="mono">Units 1–5 · be동사 · 현재진행형 · 현재시제</span>
    <h1>배우고, 풀고, 점수 확인까지.</h1>
    <p>각 단원에는 예문이 있는 짧은 문법 설명과 연습문제가 있어요. 문제는 이 페이지에서 바로 풀고, <b>Check</b> 버튼을 누르면 점수와 정답을 확인할 수 있어요.</p>
  </section>
  <div class="steps">
    <div class="step"><b>1</b><div><strong>Learn 배우기</strong><span>규칙과 형광펜 표시된 예문을 읽어요.</span></div></div>
    <div class="step"><b>2</b><div><strong>Practice 풀기</strong><span>답을 쓰거나, 고르거나, 단어로 문장을 만들어요.</span></div></div>
    <div class="step"><b>3</b><div><strong>Check 확인</strong><span>점수를 보고 틀린 문제를 고쳐요.</span></div></div>
  </div>
  <div class="sec-title"><h2>단원 목록</h2><span>이 기기에서 ${UNITS.length}개 단원 중 ${done}개 연습함</span></div>
  <div class="grid">
    ${UNITS.map(u=>{
      const b = best[u.id];
      return `<article class="ucard" style="--uc:var(--u${u.id})">
        <div class="top"><span class="unum">${u.id}</span><div><h3>${u.title}</h3><div class="focus">${u.focus}</div></div></div>
        <div class="sample">${u.sample}</div>
        <div class="meta"><span>연습 ${u.sets.length}세트 · ${total(u)}문항</span><span>${b==null?"아직 안 풀었어요":"최고 점수 "+b+"%"}</span></div>
        <div class="bar" aria-hidden="true"><i style="width:${b||0}%"></i></div>
        <div class="actions"><a class="btn" href="#unit${u.id}">설명 보기</a><a class="btn primary" href="#unit${u.id}-practice">문제 풀기</a></div>
      </article>`;}).join("")}
  </div>
  <p class="foot">최고 점수는 지금 사용하는 브라우저에만 저장돼요. 설명과 연습문제는 기초 문법 교재 1~5과의 주제를 따라 새로 만들었어요.</p>`;
}

/* ---------- unit ---------- */
function renderUnit(id, tab){
  const u = UNITS[id-1];
  document.title = `Unit ${id} · ${u.title} · Grammar Lab`;
  const prev = UNITS[id-2], next = UNITS[id];
  app.innerHTML = `
  <div style="--uc:var(--u${id})">
    <a class="crumb" href="#home">← 전체 단원</a>
    <div class="uhead"><span class="unum">${id}</span><div><h1>${u.title}</h1><p>${u.intro}</p></div></div>
    <div class="tabs" role="tablist">
      <a class="tab" role="tab" href="#unit${id}" aria-selected="${tab==="learn"}">Learn</a>
      <a class="tab" role="tab" href="#unit${id}-practice" aria-selected="${tab==="practice"}">Practice <small>${total(u)}문항</small></a>
    </div>
    <div id="panel"></div>
    <nav class="unav">
      ${prev?`<a href="#unit${prev.id}"><span>← 이전 단원</span>Unit ${prev.id}: ${prev.title}</a>`:"<span></span>"}
      ${next?`<a href="#unit${next.id}" style="text-align:right"><span>다음 단원 →</span>Unit ${next.id}: ${next.title}</a>`:`<a href="#home" style="text-align:right"><span>마지막 단원</span>전체 단원으로</a>`}
    </nav>
  </div>`;
  const panel = $("#panel");
  if(tab==="learn"){
    panel.innerHTML = u.learn.map(s=>`<section class="lsec"><div class="letter">${s.k}</div><div style="min-width:0"><h2>${s.t}</h2>${s.body}</div></section>`).join("") +
      `<div class="gonext"><a class="btn primary" href="#unit${id}-practice">연습문제 풀러 가기 →</a></div>`;
  } else {
    renderPractice(u, panel);
  }
}

/* ---------- practice ---------- */
function renderPractice(u, panel){
  panel.innerHTML = u.sets.map((s,si)=>`
    <section class="set" data-si="${si}">
      <div class="set-h"><h2><span class="sid">${s.id}</span>${s.title}</h2><span class="badge" data-badge>${s.items.length}문항</span></div>
      <p class="instr">${s.instr}</p>
      ${s.example?`<p class="example">예시: ${s.example[0].replace("___","<i>"+esc(s.example[1])+"</i>")}${s.example[0].includes("___")?"":` → <i>${esc(s.example[1])}</i>`}</p>`:""}
      <ol class="items">${s.items.map((it,ii)=>itemHTML(s,it,si,ii)).join("")}</ol>
      <div class="set-f"><button class="btn primary" data-check>채점하기</button><button class="btn" data-reset>지우기</button></div>
    </section>`).join("") + `
    <div class="finish"><p>모든 문제를 다 풀었나요? 한 번에 채점하고 단원 점수를 확인해 보세요.</p><button class="btn primary" id="finishBtn">전체 채점 &amp; 점수 보기</button></div>
    <div id="result"></div>`;

  panel.querySelectorAll(".set").forEach(sec=>{
    const s = u.sets[+sec.dataset.si];
    sec.querySelector("[data-check]").onclick = ()=>{ checkSet(s, sec); };
    sec.querySelector("[data-reset]").onclick = ()=>{ resetSet(s, sec); };
  });
  wireInteractions(panel);
  $("#finishBtn").onclick = ()=>finishUnit(u, panel);
}

function itemHTML(s, it, si, ii){
  const id = `q${s.id.replace(".","_")}_${ii}`;
  let body = "";
  if(s.type==="type"){
    const input = `<input class="ans${s.wide?" wide":""}" id="${id}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Answer ${ii+1}">`;
    if(it.q.includes("___")) body = it.q.replace("___", input);
    else body = s.wide ? `${it.q}${input}` : `<b>${it.q}</b><span class="arrow">→</span>${input}`;
  } else if(s.type==="mc"){
    const opts = s.fixed ? it.o : shuffle(it.o);
    const group = `<span class="opts${s.stack?" stack":""}" role="radiogroup" aria-label="Question ${ii+1}">${opts.map(o=>`<button type="button" class="opt" role="radio" aria-checked="false" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</span>`;
    body = it.q ? `<div>${it.q}</div>${group}` : group;
  } else if(s.type==="select"){
    if(!s._opts) s._opts = shuffle(s.options);
    body = `<label for="${id}"><b>${it.q}</b></label><br><select class="ans" id="${id}"><option value="">대답을 고르세요…</option>${s._opts.map(o=>`<option>${esc(o)}</option>`).join("")}</select>`;
  } else if(s.type==="order"){
    body = `<div class="line" data-line aria-label="Your sentence"></div><div class="bank" data-bank>${shuffle(it.w).map(w=>`<button type="button" class="tile">${esc(w)}</button>`).join("")}</div>`;
  }
  return `<li class="item" data-ii="${ii}"><div class="q">${body}<span class="fix" hidden></span></div><span class="mark" aria-live="polite"></span></li>`;
}

function wireInteractions(root){
  root.addEventListener("click", e=>{
    const opt = e.target.closest(".opt");
    if(opt){
      opt.parentElement.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-checked","false"));
      opt.setAttribute("aria-checked","true");
      clearMark(opt.closest(".item"));
      return;
    }
    const tile = e.target.closest(".tile");
    if(tile){
      const item = tile.closest(".item");
      const line = item.querySelector("[data-line]"), bank = item.querySelector("[data-bank]");
      (tile.parentElement===line ? bank : line).appendChild(tile);
      clearMark(item);
    }
  });
  root.addEventListener("input", e=>{ const it = e.target.closest(".item"); if(it) clearMark(it); });
  root.addEventListener("change", e=>{ const it = e.target.closest(".item"); if(it) clearMark(it); });
  root.addEventListener("keydown", e=>{
    if(e.key==="Enter" && e.target.matches("input.ans")){
      e.preventDefault();
      const all = [...root.querySelectorAll("input.ans")];
      const n = all[all.indexOf(e.target)+1];
      if(n) n.focus(); else e.target.blur();
    }
  });
}
function clearMark(item){
  if(!item.classList.contains("ok") && !item.classList.contains("bad")) return;
  item.classList.remove("ok","bad"); item.querySelector(".mark").textContent="";
  const f=item.querySelector(".fix"); f.hidden=true; f.innerHTML="";
}

function readAnswer(s, li){
  if(s.type==="type") return li.querySelector("input").value;
  if(s.type==="mc"){ const b=li.querySelector('.opt[aria-checked="true"]'); return b?b.dataset.v:""; }
  if(s.type==="select") return li.querySelector("select").value;
  if(s.type==="order") return [...li.querySelectorAll("[data-line] .tile")].map(t=>t.textContent).join(" ");
}
function isCorrect(s, it, val){
  if(!String(val).trim()) return false;
  if(s.type==="mc" || s.type==="select") return val===it.a;
  const ex = !s.strict;
  return it.a.some(a=>norm(a,ex)===norm(val,ex));
}
function checkSet(s, sec){
  let right = 0;
  sec.querySelectorAll(".item").forEach(li=>{
    const it = s.items[+li.dataset.ii];
    const ok = isCorrect(s, it, readAnswer(s, li));
    li.classList.toggle("ok", ok); li.classList.toggle("bad", !ok);
    li.querySelector(".mark").textContent = ok ? "✓" : "✗";
    li.querySelector(".mark").setAttribute("aria-label", ok?"correct":"incorrect");
    const fix = li.querySelector(".fix");
    if(ok){ fix.hidden=true; fix.innerHTML=""; }
    else {
      const ans = Array.isArray(it.a) ? it.a.map(esc).join(" &nbsp;또는&nbsp; ") : esc(it.a);
      fix.innerHTML = `정답: <b>${ans}</b>`; fix.hidden=false;
    }
    if(ok) right++;
  });
  const n = s.items.length, badge = sec.querySelector("[data-badge]");
  badge.textContent = `${right} / ${n}`;
  badge.className = "badge " + (right/n>=0.7 ? "good" : "low");
  return right;
}
function resetSet(s, sec){
  sec.querySelectorAll(".item").forEach(li=>{
    clearMark(li);
    li.querySelectorAll("input").forEach(i=>i.value="");
    li.querySelectorAll("select").forEach(i=>i.value="");
    li.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-checked","false"));
    const line = li.querySelector("[data-line]");
    if(line){ const bank=li.querySelector("[data-bank]"); [...line.children].forEach(t=>bank.appendChild(t)); }
  });
  const badge = sec.querySelector("[data-badge]");
  badge.className="badge"; badge.textContent=`${s.items.length}문항`;
}
function finishUnit(u, panel){
  let right=0; const rows=[];
  panel.querySelectorAll(".set").forEach(sec=>{
    const s=u.sets[+sec.dataset.si]; const r=checkSet(s, sec);
    right+=r; rows.push(`<div><span>${s.id} ${esc(s.title)}</span><b>${r}/${s.items.length}</b></div>`);
  });
  const n=total(u), pct=Math.round(right/n*100);
  saveBest(u.id, pct);
  const msg = pct===100 ? "만점이에요! 정말 잘했어요."
    : pct>=80 ? "아주 잘했어요! 빨간색으로 표시된 문제만 다시 확인해 보세요."
    : pct>=60 ? "잘하고 있어요. 정답을 확인한 뒤 다시 도전해 보세요."
    : "Learn 탭에서 규칙을 다시 읽고 한 번 더 풀어 보세요.";
  const next = UNITS[u.id];
  $("#result").innerHTML = `<section class="result" tabindex="-1" id="resultBox">
    <span class="mono">Unit ${u.id} 점수</span>
    <div class="big">${right} / ${n}<small>${pct}%</small></div>
    <div class="bar" style="--uc:var(--u${u.id})"><i style="width:${pct}%"></i></div>
    <h2>${msg}</h2>
    <div class="breakdown">${rows.join("")}</div>
    <div class="actions" style="flex-wrap:wrap">
      <button class="btn" id="retry">다시 풀기</button>
      <a class="btn" href="#unit${u.id}">설명 다시 보기</a>
      ${next?`<a class="btn primary" href="#unit${next.id}">다음: Unit ${next.id} →</a>`:`<a class="btn primary" href="#home">전체 단원으로</a>`}
    </div></section>`;
  const box=$("#resultBox"); box.focus({preventScroll:true}); box.scrollIntoView({behavior:"smooth",block:"center"});
  $("#retry").onclick=()=>{ u.sets.forEach(s=>delete s._opts); renderPractice(u, panel); window.scrollTo(0, panel.offsetTop-80); };
}

route();
</script>

</body></html>
